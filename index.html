<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CLOSER — 대시보드로 이동</title>
<meta name="description" content="CLOSER 세일즈 오퍼레이션 대시보드로 이동합니다." />
<!-- 첫 랜딩 = 대시보드. JS 리다이렉트는 jsdom 검증(tools/verify.js)에서
     navigation 오류가 되므로 meta refresh만 사용한다 — file:// 에서도 동작한다. -->
<meta http-equiv="refresh" content="0; url=app/dashboard.html" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="assets/css/base.css" />
<style>
  .go { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--color-paper); }
  .go__card { text-align: center; padding: var(--space-2xl); }
  .go__card h1 { font-size: var(--text-lg); color: var(--color-ink); margin: 0 0 var(--space-sm); }
  .go__card p { font-size: var(--text-md); color: var(--color-ink-2); margin: 0; }
  .go__card a { color: var(--color-accent); }
</style>
</head>
<body>
<main class="go">
  <div class="go__card">
    <h1>CLOSER</h1>
    <p>대시보드로 이동 중입니다 — 자동으로 넘어가지 않으면
      <a href="app/dashboard.html">여기를 누르세요</a>.
      제품 소개는 <a href="landing.html">landing.html</a>에 있습니다.</p>
  </div>
</main>
</body>
</html>
