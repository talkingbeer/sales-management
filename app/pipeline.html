<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>파이프라인 · CLOSER</title>
<meta name="description" content="영업기회를 단계별 보드로 관리합니다. 카드를 끌어 단계를 옮기고, 정체·마감 위험을 한 화면에서 확인합니다." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../tokens.css" />
<link rel="stylesheet" href="../assets/css/base.css" />
<link rel="stylesheet" href="../assets/css/components.css" />
<link rel="stylesheet" href="../assets/css/app.css" />
<style>
  /* 이 화면에만 필요한 보강. 값은 전부 토큰을 참조합니다. */
  .pipe-bar { border-bottom: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-md); }
  .pipe-ctl { display: inline-flex; align-items: center; gap: var(--space-2xs); min-width: 0; }
  .pipe-ctl > label {
    font-family: var(--font-mono); font-size: var(--text-2xs); letter-spacing: var(--track-mono);
    text-transform: uppercase; color: var(--color-ink-4); white-space: nowrap;
  }
  .pipe-ctl .select { max-width: 168px; }
  .pipe-ctl .input { width: 88px; }
  .pipe-views { display: flex; max-width: 100%; overflow-x: auto; overscroll-behavior-x: contain; }

  .pipe-board { align-items: stretch; }
  .pipe-board .kanban__col { max-height: none; }
  .pipe-board .kanban__list { max-height: 58vh; }
  .kanban__n { font-family: var(--font-mono); color: var(--color-ink-3); font-weight: 500; }
  .kanban__cast { display: block; font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--color-ink-4); letter-spacing: var(--track-mono); margin-top: 1px; }

  .kcard:focus-visible { border-color: var(--color-accent); }
  .kcard[data-locked="1"] { cursor: pointer; }
  .kcard__top { display: flex; align-items: flex-start; gap: var(--space-2xs); }
  .kcard__acct { font-size: var(--text-xs); color: var(--color-ink-3); margin-top: var(--space-3xs); overflow-wrap: anywhere; }
  .kcard__flags { display: flex; flex-wrap: wrap; gap: var(--space-2xs); margin-top: var(--space-2xs); }
  .kcard__more { flex: 0 0 auto; margin-top: -2px; }
  .kcol-empty { padding: var(--space-md) var(--space-xs); text-align: center; font-size: var(--text-xs); color: var(--color-ink-4); }

  @media (max-width: 640px) {
    .pipe-board .kanban__col { flex: 0 0 244px; }
    .pipe-ctl .select { max-width: 132px; }
  }
</style>
</head>
<body class="app">
<a class="skip-link" href="#main">본문으로 건너뛰기</a>

<div class="app-main">
  <main class="app-page" id="main">

    <div class="page-head">
      <div>
        <h1 class="page-head__title">파이프라인</h1>
        <p class="page-head__sub" id="subline"></p>
      </div>
      <div class="page-head__acts" id="headActs">
        <a class="btn btn--sm" href="opportunities.html">리스트로 보기</a>
      </div>
    </div>

    <section class="filterbar pipe-bar" id="filters" aria-label="파이프라인 필터">
      <span class="pipe-ctl">
        <label for="fOwner">담당자</label>
        <select class="select" id="fOwner"></select>
      </span>
      <span class="pipe-ctl">
        <label for="fStage">단계</label>
        <select class="select" id="fStage"></select>
      </span>
      <span class="pipe-ctl">
        <label for="fType">유형</label>
        <select class="select" id="fType"></select>
      </span>
      <span class="pipe-ctl">
        <label for="fMin">최소 금액</label>
        <span class="input-group">
          <input class="input input--num" id="fMin" type="number" min="0" step="100" inputmode="numeric" placeholder="0" />
          <span class="input-group__addon">만원</span>
        </span>
      </span>
      <span class="pipe-views">
        <span class="seg" id="fViews" role="group" aria-label="리스트 뷰"></span>
      </span>
      <span class="grow"></span>
      <span class="filterbar__count" id="fCount"></span>
      <button class="btn btn--ghost btn--sm" type="button" id="fReset">필터 초기화</button>
    </section>

    <p class="t-micro mt-xs" id="boardHint"></p>

    <section class="kanban pipe-board mt-sm" id="board" aria-label="단계별 영업기회 보드" data-verify></section>

    <section class="panel reveal mt-lg">
      <div class="panel__head">
        <h2 class="panel__title">이 필터에 대한 분석 의견</h2>
        <a class="link" href="insights.html">전체 보기</a>
      </div>
      <div class="panel__body stack gap-xs" id="insightList" data-verify></div>
    </section>

    <footer class="hairline mt-2xl" style="padding-block:var(--space-md)">
      <p class="t-mono t-faint">CLOSER · 데모 데이터 · 모든 회사·인물·연락처는 가상입니다</p>
    </footer>
  </main>
</div>

<script src="../assets/js/seed.js"></script>
<script src="../assets/js/util.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/domain.js"></script>
<script src="../assets/js/metrics.js"></script>
<script src="../assets/js/insights.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/charts.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
(function () {
  'use strict';
  var C = window.CLOSER, U = C.util, db = C.db, D = C.domain, M = C.metrics, ui = C.ui;
  C.shell.mount('pipeline');

  var $ = U.qs, esc = U.esc;
  var me = db.me();
  var canUpdate = D.can('opportunities', 'U');
  var canCreate = D.can('opportunities', 'C');
  var VIS = db.visibleUserIds();
  var QUARTER = M.scope();               // 성사·실주 컬럼은 이번 분기만 봅니다.
  var COLS = D.OPEN_STAGES.concat([D.stage('계약체결'), D.stage('실주')]);

  /* ── 상태 — URL 파라미터가 초기값을 만든다 ────────────────────────── */
  var SAVED = db.where('listViews', function (v) { return v.object === 'opportunities'; });
  var VIEW_KEYS = SAVED.map(function (v) { return v.filter; }).concat(['overdue']);

  var state = {
    owner: 'me',
    stage: 'all',
    type: 'all',
    min: 0,
    view: 'all'
  };
  var WIDER = me.role === '관리자' ? 'all' : (VIS.length > 1 ? 'team' : null);

  (function readURL() {
    var f = U.param('filter');
    if (f && VIEW_KEYS.indexOf(f) > -1) state.view = f;
    var o = U.param('owner');
    if (o === 'team' || o === 'all' || (o && db.get('users', o))) state.owner = o;
    /* 자기 이름으로 된 딜이 없는 관리자·본부장은 첫 화면부터 팀 범위로 연다. */
    else if (WIDER && !db.where('opportunities', function (x) {
      return x.ownerId === me.id || (x.teamIds || []).indexOf(me.id) > -1;
    }).length) state.owner = WIDER;
    var st = U.param('stage');
    if (st && D.STAGES.some(function (x) { return x.key === st; })) state.stage = st;
  })();

  /* ── 스코프 ──────────────────────────────────────────────────────── */
  function ownerIds() {
    if (state.owner === 'me') return [me.id];
    if (state.owner === 'team') return VIS;
    if (state.owner === 'all') return db.all('users').map(function (u) { return u.id; });
    return [state.owner];
  }
  function scope() { return M.scope({ userIds: ownerIds() }); }

  function inOwner(o) {
    if (state.owner === 'me') return o.ownerId === me.id || (o.teamIds || []).indexOf(me.id) > -1;
    return ownerIds().indexOf(o.ownerId) > -1;
  }
  function inQuarter(v) {
    return !!v && U.days(QUARTER.from, v) >= 0 && U.days(v, QUARTER.to) >= 0;
  }
  function passes(o) {
    if (!inOwner(o)) return false;
    if (state.type !== 'all' && o.type !== state.type) return false;
    if (state.min > 0 && (o.amount || 0) < state.min) return false;
    if (state.view === 'mine-open') return o.ownerId === me.id && D.isOpen(o);
    if (state.view === 'closing-quarter') return inQuarter(o.closeDate);
    if (state.view === 'stalled') return D.isStalled(o);
    if (state.view === 'overdue') return D.isOverdue(o);
    return true;
  }
  /** 한 컬럼에 놓일 딜. 종료 단계는 이번 분기 마감 건만 — 아니면 과거가 보드를 덮는다. */
  function cardsFor(stageKey) {
    var closed = D.stage(stageKey).won || D.stage(stageKey).lost;
    var list = db.where('opportunities', function (o) {
      if (o.stage !== stageKey || !passes(o)) return false;
      return closed ? inQuarter(o.closeDate) : true;
    });
    return U.sortBy(list, 'closeDate', closed ? 'desc' : 'asc');
  }
  /* 금액 정의는 M.pipelineValue / M.weightedPipeline 과 같습니다. 필터된 집합에만 적용합니다. */
  function amountOf(list) { return U.sum(list, 'amount'); }
  function weightedOf(list) { return U.sum(list, D.weighted); }

  /* ── 필터 UI ─────────────────────────────────────────────────────── */
  function buildFilters() {
    /* 볼 수 없는 범위는 감추지 않고 비활성으로 남긴다 — 권한 경계가 보이는 편이 정직하다. */
    var owners = [
      { v: 'me', t: '내 딜', ok: true },
      { v: 'team', t: '팀 전체', ok: VIS.length > 1 },
      { v: 'all', t: '전체', ok: me.role === '관리자' }
    ];
    var peers = U.uniq(db.all('opportunities').map(function (o) { return o.ownerId; }))
      .filter(function (id) { return VIS.indexOf(id) > -1 && id !== me.id; })
      .map(function (id) { return { id: id, name: db.userName(id) }; });
    peers = U.sortBy(peers, 'name');

    $('#fOwner').innerHTML =
      owners.map(function (o) {
        return '<option value="' + esc(o.v) + '"' + (o.ok ? '' : ' disabled') + '>' +
          esc(o.t) + (o.ok ? '' : ' · 조회 권한 없음') + '</option>';
      }).join('') +
      (peers.length ? '<optgroup label="담당자별">' + peers.map(function (p) {
        return '<option value="' + esc(p.id) + '">' + esc(p.name) + '</option>';
      }).join('') + '</optgroup>' : '');
    var picked = U.qs('#fOwner option[value="' + state.owner + '"]');
    if (!picked || picked.disabled) state.owner = 'me';
    $('#fOwner').value = state.owner;

    $('#fStage').innerHTML = '<option value="all">전체 단계</option>' + COLS.map(function (s) {
      return '<option value="' + esc(s.key) + '">' + esc(s.key) + '</option>';
    }).join('');
    $('#fStage').value = state.stage;

    $('#fType').innerHTML = '<option value="all">전체 유형</option>' + D.OPP_TYPES.map(function (t) {
      return '<option value="' + esc(t) + '">' + esc(t) + '</option>';
    }).join('');
    $('#fType').value = state.type;

    $('#fMin').value = state.min ? String(state.min / 10000) : '';

    var views = [{ k: 'all', n: '전체' }]
      .concat(SAVED.map(function (v) { return { k: v.filter, n: v.name, shared: v.shared }; }))
      .concat([{ k: 'overdue', n: '마감 경과' }]);
    $('#fViews').innerHTML = views.map(function (v) {
      return '<button class="seg__item" type="button" data-view="' + esc(v.k) + '" aria-pressed="' +
        (state.view === v.k ? 'true' : 'false') + '">' + esc(v.n) + '</button>';
    }).join('');

    if (canCreate) {
      var b = U.el('button', { class: 'btn btn--primary btn--sm', type: 'button', id: 'newOpp', text: '새 영업기회' });
      b.addEventListener('click', function () { openCreate(); });
      $('#headActs').appendChild(b);
    }
  }
  var HINT = canUpdate
    ? '카드를 끌어 다른 단계에 놓으면 단계가 바뀝니다. 카드의 ⋯ 메뉴에서도 옮길 수 있고, Enter 키로 레코드를 엽니다.'
    : '내 권한으로는 영업기회를 읽기만 할 수 있습니다. 카드에서 Enter 키를 누르면 레코드가 열립니다.';

  /* ── 카드 ────────────────────────────────────────────────────────── */
  function dueMark(o, closed) {
    if (closed) return '<span class="t-mono t-faint" style="font-size:10px">' + esc(U.fmtDate(o.closeDate, 'md')) + '</span>';
    var d = U.days(C.today, o.closeDate);
    if (isNaN(d)) return '<span class="chip chip--idle">마감일 없음</span>';
    if (d < 0) return '<span class="chip chip--neg">D+' + Math.abs(d) + '</span>';
    if (d === 0) return '<span class="chip chip--warn">오늘 마감</span>';
    return '<span class="chip ' + (d <= 7 ? 'chip--warn' : 'chip--idle') + '">D-' + d + '</span>';
  }
  function riskTickets(o) {
    return db.ticketsOf(o.id).filter(function (t) {
      if (D.TICKET_OPEN.indexOf(t.status) === -1) return false;
      var s = D.slaState(t);
      return s === 'breach' || s === 'risk';
    });
  }
  function cardHTML(o, closed) {
    var acc = db.accountOf(o);
    var own = db.ownerOf(o);
    var flags = '';
    if (!closed && D.isStalled(o)) flags += '<span class="chip chip--warn">정체 ' + D.daysInStage(o) + '일</span>';
    var rt = riskTickets(o);
    if (rt.length) flags += '<span class="chip chip--neg" title="' + esc(rt.map(function (t) { return t.key + ' ' + t.title; }).join(' · ')) +
      '">제작 위험 ' + rt.length + '건</span>';
    if (closed && o.lossReason) flags += '<span class="chip chip--idle">' + esc(o.lossReason) + '</span>';
    if (!closed && o.type && o.type !== '신규') flags += '<span class="chip chip--idle">' + esc(o.type) + '</span>';

    return '<article class="kcard" data-id="' + esc(o.id) + '" tabindex="0" role="link"' +
      (canUpdate ? ' draggable="true"' : ' data-locked="1"') +
      ' aria-label="' + esc(o.name + ' · ' + o.stage + ' · ' + U.won(o.amount)) + '">' +
      '<div class="kcard__top">' +
        '<p class="kcard__name grow">' + esc(o.name) + '</p>' +
        '<button class="btn btn--ghost btn--icon btn--sm kcard__more" type="button" data-menu="' + esc(o.id) +
          '" aria-label="' + esc(o.name) + ' 카드 메뉴">⋯</button>' +
      '</div>' +
      '<p class="kcard__acct">' + esc(acc ? acc.name : '광고주 미지정') + '</p>' +
      '<div class="kcard__meta">' +
        '<span class="kcard__amt">' + U.won(o.amount) + '</span>' +
        '<span class="row gap-2xs">' + ui.avatar(own, 'sm') + dueMark(o, closed) + '</span>' +
      '</div>' +
      (flags ? '<div class="kcard__flags">' + flags + '</div>' : '') +
      '</article>';
  }

  /* ── 보드 ────────────────────────────────────────────────────────── */
  function render() {
    var cols = COLS.filter(function (s) { return state.stage === 'all' || s.key === state.stage; });
    var shown = 0, openList = [];

    $('#board').innerHTML = cols.map(function (st) {
      var closed = !!(st.won || st.lost);
      var list = cardsFor(st.key);
      shown += list.length;
      if (!closed) openList = openList.concat(list);
      return '<div class="kanban__col" data-stage="' + esc(st.key) + '">' +
        '<div class="kanban__head">' +
          '<p class="kanban__title"><span>' + esc(st.key) + '</span><span class="kanban__n">' + list.length + '</span></p>' +
          '<p class="kanban__sum">' + U.won(amountOf(list)) +
            '<span class="kanban__cast">확률 ' + st.prob + '% · ' + esc(st.cast) + (closed ? ' · 이번 분기' : '') + '</span></p>' +
        '</div>' +
        '<div class="kanban__list" data-stage="' + esc(st.key) + '">' +
          (list.length ? list.map(function (o) { return cardHTML(o, closed); }).join('')
            : '<p class="kcol-empty">' + (closed ? '이번 분기 해당 건 없음' : '이 단계의 딜 없음') + '</p>') +
        '</div></div>';
    }).join('');

    $('#fCount').textContent = shown + '건 표시 · 진행 ' + openList.length + '건';
    $('#boardHint').innerHTML = shown ? esc(HINT)
      : (WIDER || state.view !== 'all' || state.type !== 'all' || state.min > 0 || state.stage !== 'all'
        ? '조건에 맞는 영업기회가 없습니다. 필터를 넓히거나 <strong>필터 초기화</strong>를 누르세요.'
        : '내가 담당하거나 참여 중인 영업기회가 없습니다. 조회 권한이 내 담당 건으로 제한되어 있습니다.');
    $('#subline').innerHTML =
      '진행 금액 <strong>' + U.won(amountOf(openList)) + '</strong> · 가중 ' + U.won(weightedOf(openList)) +
      ' · 진행 <strong>' + openList.length + '건</strong> · ' + esc(QUARTER.label) + ' 기준 · 남은 기간 ' +
      U.days(C.today, QUARTER.to) + '일';

    U.qsa('#fViews .seg__item').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.view === state.view));
    });
    renderInsights();
    U.revealAll();
  }

  function renderInsights() {
    var list = C.insights.run(scope()).slice(0, 3);
    $('#insightList').innerHTML = list.length ? list.map(function (x) {
      return ui.insight({ kind: x.kind, label: x.label, say: x.say, why: x.why, actions: x.actions });
    }).join('') : ui.empty('지금 지적할 것이 없습니다', '이 필터 조건에서는 조치가 필요한 신호가 발견되지 않았습니다.');
  }

  /* ── 단계 이동 ───────────────────────────────────────────────────── */
  function applyMove(o, toStage, extra) {
    var st = D.stage(toStage);
    var before = {
      stage: o.stage, probability: o.probability, forecastCategory: o.forecastCategory,
      stageEnteredAt: o.stageEnteredAt, lossReason: o.lossReason || null,
      amount: o.amount, closeDate: o.closeDate, competitorId: o.competitorId || null
    };
    var patch = {
      stage: toStage, probability: st.prob, forecastCategory: st.cast,
      stageEnteredAt: new Date().toISOString(),
      lossReason: st.lost ? (extra && extra.lossReason) || null : null
    };
    if (extra && typeof extra.amount === 'number') patch.amount = extra.amount;
    if (extra && extra.closeDate) patch.closeDate = extra.closeDate;
    if (extra && Object.prototype.hasOwnProperty.call(extra, 'competitorId')) patch.competitorId = extra.competitorId;

    db.update('opportunities', o.id, patch);
    if (o.ownerId !== me.id) {
      db.notify(o.ownerId, 'stage', '‘' + o.name + '’ 단계가 ' + before.stage + ' → ' + toStage + '(으)로 변경됐습니다.',
        'opportunity.html?id=' + encodeURIComponent(o.id));
    }
    render();
    ui.toast('‘' + o.name + '’을(를) ' + toStage + ' 단계로 옮겼습니다.', {
      undo: function () { db.update('opportunities', o.id, before); render(); }
    });
  }

  var FIELD_LABEL = { amount: '금액', closeDate: '마감일', contactId: '광고주 담당자', nextStep: '다음 액션', accountId: '광고주', ownerId: '영업 담당자', lossReason: '실주 사유' };

  /** 계약체결로 옮기기 전 필수 필드 확인. 채울 수 있는 값은 이 자리에서 받는다. */
  function openWonModal(o, toStage, missing) {
    var st = D.stage(toStage);
    var amtIn = U.el('input', { class: 'input input--num', type: 'number', min: '0', step: '100', 'data-autofocus': '', placeholder: '0' });
    var dateIn = U.el('input', { class: 'input', type: 'date', value: U.iso(C.today) });
    var blockers = missing.filter(function (f) { return f !== 'amount' && f !== 'closeDate'; });
    var kids = [U.el('p', { class: 't-body', text: st.key + ' 단계로 옮기려면 아래 항목이 필요합니다. ' + st.exit })];

    if (missing.indexOf('amount') > -1) {
      kids.push(U.el('label', { class: 'field' }, [
        U.el('span', { class: 'field__label', html: '계약 금액 <span class="req">*</span>' }),
        U.el('span', { class: 'input-group' }, [amtIn, U.el('span', { class: 'input-group__addon', text: '만원' })]),
        U.el('span', { class: 'field__error', text: '0보다 큰 금액을 입력하세요.' })
      ]));
    }
    if (missing.indexOf('closeDate') > -1) {
      kids.push(U.el('label', { class: 'field' }, [
        U.el('span', { class: 'field__label', html: '계약 마감일 <span class="req">*</span>' }), dateIn,
        U.el('span', { class: 'field__error', text: '마감일을 선택하세요.' })
      ]));
    }
    if (blockers.length) {
      kids.push(U.el('p', { class: 't-micro', html: '이 화면에서 채울 수 없는 항목이 남아 있습니다: <strong>' +
        esc(blockers.map(function (f) { return FIELD_LABEL[f] || f; }).join(', ')) +
        '</strong>. 레코드 페이지에서 입력한 뒤 다시 옮기세요.' }));
    }

    ui.modal({
      title: '계약체결 전 확인', body: U.el('div', { class: 'stack gap-sm' }, kids),
      actions: [
        { label: '취소' },
        blockers.length
          ? { label: '레코드 열기', kind: 'primary', onClick: function () { window.location.href = 'opportunity.html?id=' + encodeURIComponent(o.id); } }
          : { label: '계약체결로 이동', kind: 'primary', onClick: function () {
              var extra = {};
              if (missing.indexOf('amount') > -1) {
                var v = Number(amtIn.value);
                if (!v || v <= 0) { amtIn.closest('.field').classList.add('is-invalid'); amtIn.focus(); return false; }
                extra.amount = Math.round(v * 10000);
              }
              if (missing.indexOf('closeDate') > -1) {
                if (!dateIn.value) { dateIn.closest('.field').classList.add('is-invalid'); dateIn.focus(); return false; }
                extra.closeDate = dateIn.value;
              }
              applyMove(o, toStage, extra);
            } }
      ]
    });
  }

  /** 실주는 사유 없이는 이동할 수 없다. */
  function openLossModal(o, toStage) {
    var sel = U.el('select', { class: 'select', 'data-autofocus': '' },
      [U.el('option', { value: '', text: '사유 선택' })].concat(D.LOSS_REASONS.map(function (r) {
        return U.el('option', { value: r, text: r });
      })));
    var comp = U.el('select', { class: 'select' },
      [U.el('option', { value: '', text: '해당 없음' })].concat(db.all('competitors').map(function (c) {
        return U.el('option', { value: c.id, text: c.name });
      })));
    if (o.competitorId) comp.value = o.competitorId;

    var f1 = U.el('label', { class: 'field' }, [
      U.el('span', { class: 'field__label', html: '실주 사유 <span class="req">*</span>' }), sel,
      U.el('span', { class: 'field__error', text: '실주 사유를 선택해야 이동할 수 있습니다.' })
    ]);
    var body = U.el('div', { class: 'stack gap-sm' }, [
      U.el('p', { class: 't-body', text: '‘' + o.name + '’을(를) 실주로 처리합니다. 사유는 다음 분기 전략의 재료로 쓰입니다.' }),
      f1,
      U.el('label', { class: 'field' }, [U.el('span', { class: 'field__label', text: '경쟁 대행사' }), comp]),
      U.el('p', { class: 't-micro', text: '금액 ' + U.won(o.amount) + ' · 현재 단계 ' + o.stage + ' · 체류 ' + D.daysInStage(o) + '일' })
    ]);

    ui.modal({
      title: '실주 처리', body: body,
      actions: [
        { label: '취소' },
        { label: '실주로 이동', kind: 'danger', onClick: function () {
            if (!sel.value) { f1.classList.add('is-invalid'); sel.focus(); return false; }
            applyMove(o, toStage, { lossReason: sel.value, competitorId: comp.value || null });
          } }
      ]
    });
  }

  function moveDeal(id, toStage) {
    var o = db.get('opportunities', id);
    if (!o || o.stage === toStage) return;
    if (!canUpdate) { ui.toast('영업기회를 수정할 권한이 없습니다.', { kind: 'neg' }); return; }
    var st = D.stage(toStage);
    if (st.won) {
      var missing = (st.requires || []).filter(function (f) { return !o[f]; });
      if (missing.length) { openWonModal(o, toStage, missing); return; }
    }
    if (st.lost) { openLossModal(o, toStage); return; }
    applyMove(o, toStage, null);
  }

  /* ── 새 영업기회 ─────────────────────────────────────────────────── */
  function openCreate() {
    var accounts = U.sortBy(db.where('accounts', function (a) { return VIS.indexOf(a.ownerId) > -1; }), 'name');
    if (!accounts.length) accounts = U.sortBy(db.all('accounts'), 'name');

    var name = U.el('input', { class: 'input', 'data-autofocus': '', placeholder: '예: 여름 시즌 프로모션 미디어 집행', autocomplete: 'off' });
    var acc = U.el('select', { class: 'select' }, accounts.map(function (a) {
      return U.el('option', { value: a.id, text: a.name + ' · ' + a.tier });
    }));
    var amt = U.el('input', { class: 'input input--num', type: 'number', min: '0', step: '100', placeholder: '0' });
    var date = U.el('input', { class: 'input', type: 'date', value: U.iso(U.addDays(C.today, 30)) });
    var type = U.el('select', { class: 'select' }, D.OPP_TYPES.map(function (t) { return U.el('option', { value: t, text: t }); }));
    var stage = U.el('select', { class: 'select' }, D.OPEN_STAGES.map(function (s) {
      return U.el('option', { value: s.key, text: s.key + ' · ' + s.prob + '%' });
    }));
    var next = U.el('input', { class: 'input', placeholder: '예: 1차 미디어플랜 공유', autocomplete: 'off' });
    if (state.stage !== 'all' && D.isOpen({ stage: state.stage })) stage.value = state.stage;

    function field(label, node, req, err) {
      return U.el('label', { class: 'field' }, [
        U.el('span', { class: 'field__label', html: esc(label) + (req ? ' <span class="req">*</span>' : '') }), node,
        err ? U.el('span', { class: 'field__error', text: err }) : null
      ]);
    }
    var fName = field('영업기회명', name, true, '이름을 입력하세요.');
    var fAmt = field('금액(만원)', amt, true, '0보다 큰 금액을 입력하세요.');
    var fDate = field('예상 마감일', date, true, '마감일을 선택하세요.');

    var body = U.el('div', { class: 'stack gap-sm' }, [
      fName,
      field('광고주', acc, true),
      U.el('div', { class: 'grid grid--2' }, [fAmt, fDate]),
      U.el('div', { class: 'grid grid--2' }, [field('유형', type), field('시작 단계', stage)]),
      field('다음 액션', next),
      U.el('p', { class: 't-micro', text: '담당자는 ' + me.name + '(으)로 등록됩니다. 저장 후 보드에서 바로 단계를 옮길 수 있습니다.' })
    ]);

    ui.modal({
      title: '새 영업기회', body: body, size: 'wide',
      actions: [
        { label: '취소' },
        { label: '만들기', kind: 'primary', onClick: function () {
            [fName, fAmt, fDate].forEach(function (f) { f.classList.remove('is-invalid'); });
            var v = Number(amt.value);
            if (!name.value.trim()) { fName.classList.add('is-invalid'); name.focus(); return false; }
            if (!v || v <= 0) { fAmt.classList.add('is-invalid'); amt.focus(); return false; }
            if (!date.value) { fDate.classList.add('is-invalid'); date.focus(); return false; }
            var st = D.stage(stage.value);
            var a = db.get('accounts', acc.value);
            var contact = a ? db.first('contacts', function (c) { return c.accountId === a.id; }) : null;
            var rec = db.insert('opportunities', {
              name: name.value.trim(), accountId: acc.value, ownerId: me.id,
              stage: st.key, amount: Math.round(v * 10000), probability: st.prob, forecastCategory: st.cast,
              closeDate: date.value, createdAt: new Date().toISOString(), stageEnteredAt: new Date().toISOString(),
              type: type.value, source: '직접 입력', competitorId: null,
              nextStep: next.value.trim(), lossReason: null,
              contactId: contact ? contact.id : null, campaignId: null, teamIds: []
            });
            state.owner = 'me'; state.view = 'all'; state.stage = 'all'; state.min = 0;
            $('#fOwner').value = 'me'; $('#fStage').value = 'all'; $('#fMin').value = '';
            render();
            ui.toast('‘' + rec.name + '’을(를) ' + st.key + ' 단계에 추가했습니다.', {
              undo: function () { db.remove('opportunities', rec.id); render(); }
            });
          } }
      ]
    });
  }

  /* ── 카드 메뉴 ───────────────────────────────────────────────────── */
  function openCardMenu(anchor, id) {
    var o = db.get('opportunities', id);
    if (!o) return;
    var items = [];
    if (canUpdate) {
      items.push({ label: '단계 이동 →' });
      D.STAGES.filter(function (s) { return s.key !== o.stage; }).forEach(function (s) {
        items.push({
          icon: s.order < D.stage(o.stage).order ? '←' : '→',
          label: s.key + ' · ' + s.prob + '%',
          onClick: function () { moveDeal(o.id, s.key); }
        });
      });
      items.push('-');
    }
    items.push({ icon: '↗', label: '영업기회 열기', onClick: function () {
      window.location.href = 'opportunity.html?id=' + encodeURIComponent(o.id);
    } });
    var acc = db.accountOf(o);
    if (acc) items.push({ icon: '⬢', label: acc.name + ' 열기', onClick: function () {
      window.location.href = 'account.html?id=' + encodeURIComponent(acc.id);
    } });
    ui.menu(anchor, items);
  }

  /* ── 이벤트 배선 ─────────────────────────────────────────────────── */
  buildFilters();

  U.on($('#fOwner'), 'change', function () { state.owner = this.value; render(); });
  U.on($('#fStage'), 'change', function () { state.stage = this.value; render(); });
  U.on($('#fType'), 'change', function () { state.type = this.value; render(); });
  U.on($('#fMin'), 'input', U.debounce(function () {
    var v = Number($('#fMin').value);
    state.min = v > 0 ? Math.round(v * 10000) : 0;
    render();
  }, 220));
  U.live($('#fViews'), 'click', '.seg__item', function (e, b) {
    state.view = b.dataset.view === state.view ? 'all' : b.dataset.view;
    render();
  });
  U.on($('#fReset'), 'click', function () {
    state.owner = 'me'; state.stage = 'all'; state.type = 'all'; state.min = 0; state.view = 'all';
    $('#fOwner').value = 'me'; $('#fStage').value = 'all'; $('#fType').value = 'all'; $('#fMin').value = '';
    render();
  });

  var board = $('#board');
  U.live(board, 'click', '.kcard__more', function (e, b) { e.stopPropagation(); openCardMenu(b, b.dataset.menu); });
  U.live(board, 'click', '.kcard', function (e, card) {
    if (e.target.closest('button')) return;
    window.location.href = 'opportunity.html?id=' + encodeURIComponent(card.dataset.id);
  });
  U.live(board, 'keydown', '.kcard', function (e, card) {
    if (e.key === 'Enter') { e.preventDefault(); window.location.href = 'opportunity.html?id=' + encodeURIComponent(card.dataset.id); }
  });

  /* HTML5 드래그 앤 드롭 — 이동은 낙관적으로 반영하고 되돌리기를 토스트로 준다. */
  var dragId = null, hot = null;
  function cool() { if (hot) { hot.classList.remove('is-drop'); hot = null; } }
  U.live(board, 'dragstart', '.kcard', function (e, card) {
    if (!canUpdate || card.getAttribute('draggable') !== 'true') { e.preventDefault(); return; }
    dragId = card.dataset.id;
    try { e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; } catch (x) { /* 일부 브라우저는 무시 */ }
    card.classList.add('is-dragging');
  });
  U.live(board, 'dragend', '.kcard', function (e, card) { card.classList.remove('is-dragging'); dragId = null; cool(); });
  U.live(board, 'dragover', '.kanban__col', function (e, col) {
    if (!dragId) return;
    e.preventDefault();
    try { e.dataTransfer.dropEffect = 'move'; } catch (x) { /* noop */ }
    if (hot !== col) { cool(); hot = col; col.classList.add('is-drop'); }
  });
  U.on(board, 'dragleave', function (e) {
    if (hot && !hot.contains(e.relatedTarget)) cool();
  });
  U.live(board, 'drop', '.kanban__col', function (e, col) {
    e.preventDefault();
    var id = dragId;
    if (!id) { try { id = e.dataTransfer.getData('text/plain'); } catch (x) { id = null; } }
    dragId = null; cool();
    if (id) moveDeal(id, col.dataset.stage);
  });

  render();
  if (U.param('new') === '1' && canCreate) openCreate();
})();
</script>
</body>
</html>
