<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>리포트 · CLOSER</title>
<meta name="description" content="CLOSER 리포트 빌더. 대상 객체와 그룹 기준, 측정값을 직접 조립해 표와 차트로 확인하고 CSV로 내보냅니다. 단계 전환·승패·속도·제작·매출·주간 변동 프리셋을 제공합니다." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../tokens.css" />
<link rel="stylesheet" href="../assets/css/base.css" />
<link rel="stylesheet" href="../assets/css/components.css" />
<link rel="stylesheet" href="../assets/css/app.css" />
<style>
  /* 이 화면에만 필요한 조각. 색·간격·반경·이징은 전부 토큰만 참조합니다. */
  #presets { max-width: 100%; overflow-x: auto; overscroll-behavior-x: contain; }

  .bld { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-sm); }
  .bld__f { display: flex; flex-direction: column; gap: var(--space-3xs); min-width: 0; flex: 0 1 auto; }
  .bld__k {
    font-family: var(--font-mono); font-size: var(--text-2xs); letter-spacing: var(--track-mono);
    text-transform: uppercase; color: var(--color-ink-4); white-space: nowrap;
  }
  .bld .select { max-width: 200px; }
  .bld__arrow { align-self: center; margin-top: var(--space-md); color: var(--color-ink-4); font-family: var(--font-mono); }
  .bld__go { display: flex; align-items: center; gap: var(--space-xs); flex-wrap: wrap; }

  .howto { font-size: var(--text-sm); color: var(--color-ink-2); line-height: var(--leading-loose); max-width: 88ch; }

  .res-head {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm); flex-wrap: wrap;
    padding: var(--space-xs) var(--space-md);
    border: var(--rule-hair) solid var(--color-rule); border-bottom: none;
    border-radius: var(--radius-md) var(--radius-md) 0 0;
    background: var(--color-paper-2);
  }
  .res-card {
    border: var(--rule-hair) solid var(--color-rule); border-top: none;
    border-radius: 0 0 var(--radius-md) var(--radius-md); background: var(--color-surface);
  }
  .pagerbar {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm); flex-wrap: wrap;
    padding: var(--space-xs) var(--space-md); border-top: var(--rule-hair) solid var(--color-rule);
  }
  .share { display: flex; align-items: center; gap: var(--space-xs); min-width: 112px; }
  .share__n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: var(--text-2xs); color: var(--color-ink-3); width: 40px; text-align: right; }
  .share .meter { flex: 1 1 auto; min-width: 44px; }
  .row-total { background: var(--color-paper-2); }

  .saved__row {
    display: flex; align-items: center; gap: var(--space-sm); flex-wrap: wrap;
    padding: var(--space-xs) 0; border-bottom: var(--rule-hair) solid var(--color-rule);
  }
  .saved__row:last-child { border-bottom: none; }

  .duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-lg); align-items: start; }
  @media (max-width: 900px) { .duo { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 640px) {
    .bld .select { max-width: 100%; }
    .bld__f { flex: 1 1 100%; }
    .bld__arrow { display: none; }
    .res-head, .pagerbar { padding-inline: var(--space-sm); }
  }
</style>
</head>
<body class="app">
<a class="skip-link" href="#main">본문으로 건너뛰기</a>

<div class="app-main">
  <main class="app-page" id="main">

    <div class="page-head">
      <div>
        <h1 class="page-head__title">리포트</h1>
        <p class="page-head__sub" id="subline"></p>
      </div>
      <div class="page-head__acts" id="headActs"></div>
    </div>

    <section aria-label="리포트 프리셋">
      <div class="seg" id="presets" role="group" aria-label="리포트 프리셋"></div>
    </section>

    <section class="mt-md" aria-label="리포트 빌더">
      <div class="panel">
        <div class="panel__head">
          <h2 class="panel__title">리포트 빌더</h2>
          <span class="t-mono" id="builderState"></span>
        </div>
        <div class="panel__body stack gap-md" id="builder">
          <div class="bld">
            <label class="bld__f"><span class="bld__k">대상 객체</span><select class="select" id="fObj"></select></label>
            <span class="bld__arrow" aria-hidden="true">›</span>
            <label class="bld__f"><span class="bld__k">그룹 기준</span><select class="select" id="fGroup"></select></label>
            <span class="bld__arrow" aria-hidden="true">›</span>
            <label class="bld__f"><span class="bld__k">측정값</span><select class="select" id="fMeasure"></select></label>
            <span class="bld__arrow" aria-hidden="true">›</span>
            <label class="bld__f"><span class="bld__k" id="periodKey">기간</span><select class="select" id="fPeriod"></select></label>
            <label class="bld__f"><span class="bld__k">담당자</span><select class="select" id="fOwner"></select></label>
            <label class="bld__f"><span class="bld__k">상태</span><select class="select" id="fStatus"></select></label>
          </div>
          <div class="bld__go">
            <span class="bld__k">표시 형식</span>
            <span class="seg" id="views" role="group" aria-label="표시 형식"></span>
            <span class="grow"></span>
            <span class="t-micro" id="dirtyNote"></span>
            <button class="btn btn--sm btn--ghost" type="button" id="resetBuilder">조건 초기화</button>
            <button class="btn btn--sm btn--primary" type="button" id="apply">적용</button>
          </div>
          <p class="t-micro" id="scopeNote"></p>
        </div>
      </div>
    </section>

    <section class="mt-lg" aria-label="이 리포트를 읽는 법">
      <div class="panel">
        <div class="panel__head">
          <h2 class="panel__title" id="howtoTitle">이 리포트를 읽는 법</h2>
          <span class="t-mono" id="howtoTag"></span>
        </div>
        <div class="panel__body">
          <p class="howto" id="howto"></p>
        </div>
      </div>
    </section>

    <section class="grid grid--4 mt-lg" id="tiles" data-verify aria-label="리포트 요약"></section>

    <section class="mt-lg" id="chartSec" aria-label="리포트 차트">
      <div class="panel" id="chartPanel">
        <div class="panel__head">
          <h2 class="panel__title" id="chartTitle">차트</h2>
          <span class="t-mono" id="chartNote"></span>
        </div>
        <div class="panel__body" id="chartHost"></div>
      </div>
    </section>

    <section class="mt-lg" aria-label="리포트 결과">
      <div class="res-head">
        <span class="t-mono" id="resultTitle"></span>
        <span class="row gap-xs">
          <span class="filterbar__count" id="resultCount"></span>
          <button class="btn btn--sm" type="button" id="csv">CSV 내보내기</button>
        </span>
      </div>
      <div class="res-card">
        <div id="tableHost" data-verify></div>
        <div class="pagerbar" id="pagerHost"></div>
      </div>
    </section>

    <section class="mt-lg" id="extraSec" aria-label="프리셋 상세 분석">
      <div class="panel" id="extraPanel">
        <div class="panel__head">
          <h2 class="panel__title" id="extraTitle">상세</h2>
          <span class="t-mono" id="extraNote"></span>
        </div>
        <div class="panel__body" id="extraHost"></div>
      </div>
    </section>

    <section class="mt-lg" aria-label="저장된 리포트">
      <div class="panel">
        <div class="panel__head">
          <h2 class="panel__title">저장된 리포트</h2>
          <span class="t-mono">이 탭에서만 유지 · 새로고침하면 사라짐</span>
        </div>
        <div class="panel__body">
          <p class="t-micro mb-sm">저장된 리포트는 브라우저에 기록되지 않습니다. 지금 보고 있는 탭의 메모리에만 남으며, 새로고침하거나 탭을 닫으면 목록이 비워집니다. 공유가 필요하면 CSV로 내보내세요.</p>
          <div id="savedHost"></div>
        </div>
      </div>
    </section>

    <footer class="hairline mt-2xl" style="padding-block:var(--space-md)">
      <p class="t-mono t-faint">CLOSER · 데모 데이터 · 모든 회사·인물·연락처는 가상입니다</p>
    </footer>
  </main>
</div>

<script src="../assets/js/seed.js"></script>
<script src="../assets/js/util.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/domain.js"></script>
<script src="../assets/js/metrics.js"></script>
<script src="../assets/js/insights.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/charts.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
(function () {
  'use strict';
  var C = window.CLOSER, U = C.util, db = C.db, D = C.domain, M = C.metrics, ui = C.ui, ch = C.charts;
  C.shell.mount('reports');

  var $ = U.qs, esc = U.esc, el = U.el;
  var me = db.me();
  var PAGE_SIZE = 25;

  /* ── 권한 ─────────────────────────────────────────────────────────────
     리포트는 모든 역할이 읽을 수 있지만, 매트릭스가 바뀌어도 화면이
     조용히 거짓말하지 않도록 여기서 한 번 확인한다. */
  if (!D.can('reports', 'R')) {
    $('#tiles').removeAttribute('data-verify');
    $('#tableHost').removeAttribute('data-verify');
    U.qsa('.app-page > section').forEach(function (s) { if (s.id !== 'denied') s.parentNode.removeChild(s); });
    var deny = el('section', { class: 'mt-lg', id: 'denied' });
    deny.innerHTML = ui.empty('리포트를 볼 권한이 없습니다',
      me.role + ' 역할에는 리포트 열람 권한이 없습니다. 필요한 집계가 있으면 영업관리자에게 요청하시면 대신 만들어 드립니다.',
      '<a class="btn btn--sm btn--primary" href="dashboard.html">홈으로</a>');
    $('#main').appendChild(deny);
    return;
  }

  /* ══ 객체 정의 ═══════════════════════════════════════════════════════
     대상 객체 하나가 "무엇을 집계할 수 있는가"를 스스로 들고 있다.
     그룹 기준·측정값·상태 필터가 객체마다 달라지는 이유가 여기에 있다. */
  function accName(id) { var a = db.get('accounts', id); return a ? a.name : '미지정'; }
  function accInd(id) { var a = db.get('accounts', id); return a ? a.industry : '미지정'; }
  var ACT_TYPE = { call: '통화', email: '메일', meeting: '미팅', task: '업무' };

  var OBJ = {
    opportunities: {
      label: '영업기회', noun: '건',
      all: function () { return db.all('opportunities'); },
      ownerOf: function (o) { return o.ownerId; },
      dateOf: function (o) { return o.closeDate; },
      dateLabel: '마감일',
      statuses: [{ v: 'open', label: '진행 중' }, { v: 'won', label: '성사' }, { v: 'lost', label: '실주' }],
      statusOk: function (o, v) { return v === 'open' ? D.isOpen(o) : v === 'won' ? D.isWon(o) : D.isLost(o); },
      measures: ['count', 'sum', 'avg', 'weighted', 'net'],
      value: {
        sum: function (o) { return o.amount || 0; },
        weighted: function (o) { return D.weighted(o); },
        net: function (o) { return D.netRevenue(o); }
      },
      groups: [
        { k: 'stage', label: '단계', order: 'path', of: function (o) { return o.stage; } },
        { k: 'funnelStage', label: '단계 (누적 통과)', cumulative: true },
        { k: 'owner', label: '담당자', of: function (o) { return db.userName(o.ownerId); } },
        { k: 'account', label: '광고주', of: function (o) { return accName(o.accountId); } },
        { k: 'industry', label: '광고주 산업', of: function (o) { return accInd(o.accountId); } },
        { k: 'type', label: '거래 유형', of: function (o) { return o.type || '미지정'; } },
        { k: 'loss', label: '실주 사유', of: function (o) { return o.lossReason || '해당 없음'; } },
        { k: 'cast', label: '예측 카테고리', of: function (o) { return D.stage(o.stage).cast; } },
        { k: 'source', label: '유입 경로', of: function (o) { return o.source || '미지정'; } },
        { k: 'closeMonth', label: '마감 월', order: 'label', of: function (o) { return U.fmtDate(o.closeDate, 'ym'); } },
        { k: 'weekly', label: '주간 변동 분류 (최근 7일)', special: 'weekly' }
      ]
    },
    accounts: {
      label: '광고주', noun: '개사',
      all: function () { return db.all('accounts'); },
      ownerOf: function (a) { return a.ownerId; },
      dateOf: function (a) { return a.lastActivityDate; },
      dateLabel: '최근 활동일',
      statuses: [{ v: '거래중', label: '거래중' }, { v: '휴면', label: '휴면' }],
      statusOk: function (a, v) { return a.status === v; },
      measures: ['count', 'sum', 'avg'],
      measureLabel: { sum: '연간 예산 합계', avg: '연간 예산 평균' },
      value: { sum: function (a) { return a.annualBudget || 0; } },
      groups: [
        { k: 'tier', label: '등급', order: 'tier', of: function (a) { return a.tier; } },
        { k: 'industry', label: '산업', of: function (a) { return a.industry; } },
        { k: 'owner', label: '담당자', of: function (a) { return db.userName(a.ownerId); } },
        { k: 'status', label: '거래 상태', of: function (a) { return a.status; } }
      ]
    },
    tickets: {
      label: '제작 의뢰', noun: '건', scoped: false,
      all: function () { return db.all('tickets'); },
      ownerOf: function (t) { return t.assigneeId; },
      dateOf: function (t) { return t.createdAt; },
      dateLabel: '접수일',
      statuses: [{ v: 'open', label: '진행 중' }, { v: 'done', label: '완료' }, { v: 'breach', label: '납기 초과' }],
      statusOk: function (t, v) {
        return v === 'open' ? D.TICKET_OPEN.indexOf(t.status) > -1
          : v === 'done' ? t.status === '완료' : D.slaState(t) === 'breach';
      },
      measures: ['count', 'hours'],
      measureLabel: { hours: '예상 공수 합계' },
      value: { hours: function (t) { return t.estimateHours || 0; } },
      groups: [
        { k: 'type', label: '제작 유형', of: function (t) { return t.type; } },
        { k: 'status', label: '상태', order: 'ticket', of: function (t) { return t.status; } },
        { k: 'priority', label: '우선순위', order: 'label', of: function (t) { return t.priority; } },
        { k: 'assignee', label: '담당자', of: function (t) { return t.assigneeId ? db.userName(t.assigneeId) : '미배정'; } },
        { k: 'requester', label: '의뢰자', of: function (t) { return db.userName(t.requesterId); } },
        { k: 'account', label: '광고주', of: function (t) { return accName(t.accountId); } },
        { k: 'sla', label: '납기 상태', of: function (t) {
            var s = D.slaState(t);
            return s === 'breach' ? '초과' : s === 'risk' ? '임박' : s === 'done' ? '마감됨' : '정상';
          } }
      ]
    },
    activities: {
      label: '활동', noun: '건',
      all: function () { return db.all('activities'); },
      ownerOf: function (a) { return a.ownerId; },
      dateOf: function (a) { return a.dueDate; },
      dateLabel: '예정일',
      statuses: [{ v: '완료', label: '완료' }, { v: '예정', label: '예정' }],
      statusOk: function (a, v) { return a.status === v; },
      measures: ['count'],
      value: {},
      groups: [
        { k: 'type', label: '활동 유형', of: function (a) { return ACT_TYPE[a.type] || a.type; } },
        { k: 'owner', label: '담당자', of: function (a) { return db.userName(a.ownerId); } },
        { k: 'status', label: '상태', of: function (a) { return a.status; } },
        { k: 'month', label: '월', order: 'label', of: function (a) { return U.fmtDate(a.dueDate, 'ym'); } },
        { k: 'related', label: '연결 대상', of: function (a) { return a.relatedType === 'opportunity' ? '영업기회' : '광고주'; } }
      ]
    },
    campaigns: {
      label: '캠페인', noun: '건',
      all: function () { return db.all('campaigns'); },
      ownerOf: function (c) { return c.ownerId; },
      dateOf: function (c) { return c.startDate; },
      dateLabel: '시작일',
      statuses: [{ v: '집행중', label: '집행중' }, { v: '예정', label: '예정' }, { v: '종료', label: '종료' }],
      statusOk: function (c, v) { return c.status === v; },
      measures: ['count', 'sum', 'avg', 'net'],
      measureLabel: { sum: '집행 예산 합계', avg: '집행 예산 평균', net: '전환 매출 합계' },
      value: { sum: function (c) { return c.budget || 0; }, net: function (c) { return c.revenue || 0; } },
      groups: [
        { k: 'status', label: '집행 상태', of: function (c) { return c.status; } },
        { k: 'channel', label: '매체', of: function (c) {
            var m = db.get('mediaChannels', c.channelId); return m ? m.name : '미지정';
          } },
        { k: 'group', label: '매체 그룹', of: function (c) {
            var m = db.get('mediaChannels', c.channelId); return m ? m.group : '미지정';
          } },
        { k: 'account', label: '광고주', of: function (c) { return accName(c.accountId); } },
        { k: 'objective', label: '캠페인 목표', of: function (c) { return c.objective || '미지정'; } },
        { k: 'month', label: '시작 월', order: 'label', of: function (c) { return U.fmtDate(c.startDate, 'ym'); } }
      ]
    },
    actuals: {
      label: '실적', noun: '건',
      all: function () { return db.all('actuals'); },
      ownerOf: function (a) { return a.ownerId; },
      dateOf: function (a) { return a.period + '-01'; },
      dateLabel: '실적 월',
      statuses: [{ v: '확정', label: '확정' }, { v: '제출', label: '제출' }, { v: '임시저장', label: '임시저장' }],
      statusOk: function (a, v) { return a.status === v; },
      measures: ['count', 'sum', 'avg', 'net'],
      measureLabel: { sum: '실적 금액 합계', avg: '실적 금액 평균', net: '순매출 합계' },
      value: { sum: function (a) { return a.amount || 0; }, net: function (a) { return a.netRevenue || 0; } },
      groups: [
        { k: 'kind', label: '실적 구분', of: function (a) { return a.kind; } },
        { k: 'owner', label: '담당자', of: function (a) { return db.userName(a.ownerId); } },
        { k: 'period', label: '실적 월', order: 'label', of: function (a) { return a.period; } },
        { k: 'status', label: '입력 상태', of: function (a) { return a.status; } },
        { k: 'account', label: '광고주', of: function (a) { return accName(a.accountId); } }
      ]
    }
  };
  var OBJ_KEYS = ['opportunities', 'accounts', 'tickets', 'activities', 'campaigns', 'actuals'];

  var MEASURE_LABEL = {
    count: '건수', sum: '금액 합계', avg: '금액 평균',
    weighted: '가중금액', net: '순매출', hours: '공수 합계'
  };
  function measureLabel(objKey, m) {

  var PERIODS = [

  /* ══ 프리셋 ═══════════════════════════════════════════════════════════
     인사이트 화면이 ?r= 로 이 화면에 들어온다. 프리셋은 빌더를 특정
     조합으로 세팅할 뿐이고, 결과를 만드는 엔진은 하나다. */
  var PRESETS = [

      how: '체류일은 각 딜이 지금 단계에 들어온 날부터 오늘까지의 일수입니다. 이미 지나간 단계에 쓴 시간이 아니라 지금 멈춰 있는 시간이라는 점이 중요합니다. 단계마다 허용 일수가 다르므로 절대값보다 허용치 대비로 읽어야 하고, 평균이 허용치 아래여도 오래된 딜 몇 건이 한 단계에 몰려 있으면 평균은 그 사실을 감춥니다. 평균과 정체 건수를 함께 보고, 정체가 쌓인 단계를 이번 주의 표적으로 삼으세요.' },
    { key: 'pipeline', label: '담당자별 파이프라인',
      cfg: { obj: 'opportunities', group: 'owner', measure: 'sum', period: 'all', owner: '', status: 'open', view: 'bars' },
      how: '담당자별 진행 금액은 “누가 일을 많이 들고 있는가”이지 “누가 잘하고 있는가”가 아닙니다. 반드시 가중금액(금액 × 단계 확률)과 함께 보세요. 금액은 큰데 가중이 낮으면 초기 단계에 몰려 있다는 뜻이고, 이번 분기 안에 숫자가 될 가능성은 그만큼 낮습니다. 반대로 건수는 적은데 가중 비중이 높은 담당자는 이미 후반 단계에 자원을 집중한 상태이므로, 새 딜을 더 얹기보다 마감을 돕는 편이 낫습니다.' },
    { key: 'production', label: '제작 유형별',

    { key: 'revenue', label: '월별 매출·순매출',
      cfg: { obj: 'opportunities', group: 'closeMonth', measure: 'sum', period: 'm12', owner: '', status: 'won', view: 'line' },
      how: '매출은 계약 금액(취급고)이고 순매출은 대행 수수료 기준입니다. 두 선이 나란히 움직이지 않는 달이 중요합니다. 매출이 늘었는데 순매출이 따라 늘지 않은 달은 수수료율이 낮은 매체비 비중이 커진 달, 즉 많이 팔았지만 덜 남은 달입니다. 집계 기준은 딜의 마감일이므로 실제 집행 시점과는 다를 수 있습니다. 특정 달의 급등이 한두 건의 큰 딜 때문인지 확인하려면 측정값을 금액 평균으로 바꿔 보세요.' },
    { key: 'weekly', label: '주간 파이프라인 변동',
      cfg: { obj: 'opportunities', group: 'weekly', measure: 'sum', period: 'all', owner: '', status: '', view: 'table' },
      how: '막대 넷은 최근 7일 동안 딜에 일어난 네 가지 사건을 금액으로 모은 것입니다. 신규 유입과 단계 상승은 파이프라인에 무게를 더한 쪽, 성사와 실주는 파이프라인에서 빠져나간 쪽입니다. 다만 단계 상승은 총액을 바꾸지 않고 확률만 올리므로, 워터폴의 누적선은 “파이프라인 총액”이 아니라 “움직인 금액”의 누적으로 읽어야 합니다. 실제 총액은 차트 위의 지난주·이번 주 두 숫자를 비교하세요. 성사와 실주가 함께 크고 신규 유입이 작은 주는 다음 달 파이프라인이 얇아지는 주입니다.' }
  ];
  function preset(key) {
    for (var i = 0; i < PRESETS.length; i++) if (PRESETS[i].key === key) return PRESETS[i];
    return PRESETS[0];
  }

  /* ── 상태 — URL 파라미터가 초기값을 결정합니다 ─────────────────────── */
  var isMaker = me.role === '제작인력' || me.role === '리소스매니저';
  var initKey = U.param('r', '') || '';
  if (!preset(initKey) || initKey !== preset(initKey).key) initKey = isMaker ? 'production' : 'pipeline';

  var state = Object.assign({ preset: initKey }, preset(initKey).cfg);
  ['obj', 'group', 'measure', 'period', 'owner', 'status', 'view'].forEach(function (k) {
    var v = U.param(k, '');
    if (v) { state[k] = v; state.preset = 'custom'; }
  });
  state.page = 1;
  normalize(state);

  function normalize(s) {
    if (!OBJ[s.obj]) s.obj = 'opportunities';
    var o = OBJ[s.obj];
    if (!groupDef(s.obj, s.group)) s.group = o.groups[0].k;
    if (o.measures.indexOf(s.measure) === -1) s.measure = 'count';
    if (PERIODS.map(function (p) { return p.v; }).indexOf(s.period) === -1) s.period = 'all';
    if (s.status && !o.statuses.some(function (x) { return x.v === s.status; })) s.status = '';
    if (s.owner && !db.get('users', s.owner)) s.owner = '';
    if (VIEWS.map(function (v) { return v.v; }).indexOf(s.view) === -1) s.view = 'bars';
    return s;
  }
  function groupDef(objKey, k) {
    var gs = OBJ[objKey].groups;
    for (var i = 0; i < gs.length; i++) if (gs[i].k === k) return gs[i];
    return null;
  }

  var draft = { obj: state.obj, group: state.group, measure: state.measure, period: state.period, owner: state.owner, status: state.status };

  /* ══ 집계 엔진 ═══════════════════════════════════════════════════════ */
  var visible = db.visibleUserIds();

  /** 담당자 범위와 상태·기간 필터를 적용한 원본 행. */
  function baseRows(opt) {
    var o = OBJ[state.obj];
    var rows = o.all();
    if (o.scoped !== false) rows = rows.filter(function (r) { return visible.indexOf(o.ownerOf(r)) > -1; });
    if (state.owner) rows = rows.filter(function (r) { return o.ownerOf(r) === state.owner; });
    if (!(opt && opt.rawStatus)) {
      if (state.status) rows = rows.filter(function (r) { return o.statusOk(r, state.status); });
      var w = windowOf(state.period);
      if (w) rows = rows.filter(function (r) {
        var d = o.dateOf(r);
        return d && U.days(w.from, d) >= 0 && U.days(d, w.to) >= 0;
      });
    }
    return rows;
  }

  function measureValue(rows) {
    var m = state.measure, o = OBJ[state.obj];
    if (m === 'count') return rows.length;
    var f = o.value[m === 'avg' ? 'sum' : m];
    if (!f) return 0;
    var s = U.sum(rows, f);
    return m === 'avg' ? (rows.length ? s / rows.length : 0) : s;
  }
  function fmtMeasure(v) {
    if (state.measure === 'count') return U.num(v) + OBJ[state.obj].noun;
    if (state.measure === 'hours') return U.num(v, 1) + '시간';
    return U.won(v);
  }
  function fmtAxis(v) {
    if (state.measure === 'count' || state.measure === 'hours') return U.num(v);
    return U.won(v, { unit: false });
  }

  var TICKET_ORDER = D.TICKET_STATUS;
  function sortGroups(list, def) {
    if (def && def.order === 'path') return U.sortBy(list, function (g) { return D.stage(g.label).order; });
    if (def && def.order === 'tier') return U.sortBy(list, function (g) { return D.ACCOUNT_TIERS.indexOf(g.label); });
    if (def && def.order === 'ticket') return U.sortBy(list, function (g) { return TICKET_ORDER.indexOf(g.label); });
    if (def && def.order === 'label') return U.sortBy(list, 'label');
    return U.sortBy(list, 'value', 'desc');
  }

  /** 최근 7일 동안 딜에 일어난 네 가지 사건. stageEnteredAt·closeDate만 씁니다. */
  function weeklyParts() {
    var rows = baseRows({ rawStatus: true });
    var from = U.addDays(C.today, -7);
    function inWeek(d) { return !!d && U.days(from, d) >= 0 && U.days(d, C.today) >= 0; }
    var newly = rows.filter(function (o) { return inWeek(o.createdAt); });
    var won = rows.filter(function (o) { return D.isWon(o) && inWeek(o.closeDate); });
    var lost = rows.filter(function (o) { return D.isLost(o) && inWeek(o.closeDate); });
    var adv = rows.filter(function (o) { return D.isOpen(o) && inWeek(o.stageEnteredAt) && !inWeek(o.createdAt); });
    var openNow = rows.filter(D.isOpen);
    var base = openNow.concat(won).concat(lost);
    var prevSet = base.filter(function (o) { return !inWeek(o.createdAt); });
    return {
      from: from,
      buckets: [
        { label: '신규 유입', rows: newly, sign: 1 },
        { label: '단계 상승', rows: adv, sign: 1 },
        { label: '성사', rows: won, sign: -1 },
        { label: '실주', rows: lost, sign: -1 }
      ],
      nowAmt: U.sum(openNow, 'amount'),
      prevAmt: U.sum(prevSet, 'amount'),
      openCount: openNow.length,
      prevCount: prevSet.length
    };
  }

  /** 결과 계산 — 표·차트·타일·CSV가 모두 이 하나를 봅니다. */
  function compute() {
    var def = groupDef(state.obj, state.group);
    var rows, groups, cumulative = false, baseCount, baseValue;

    if (def.special === 'weekly') {
      var wk = weeklyParts();
      groups = wk.buckets.map(function (b) {
        return { label: b.label, rows: b.rows, value: measureValue(b.rows), count: b.rows.length, sign: b.sign };
      });
      baseCount = U.sum(groups, 'count');
      baseValue = U.sum(groups, function (g) { return g.value; });
      return { def: def, groups: groups, cumulative: false, baseCount: baseCount, baseValue: baseValue, weekly: wk, rows: [] };
    }

    rows = baseRows();

    if (def.cumulative) {
      cumulative = true;
      groups = D.STAGES.filter(function (st) { return !st.lost; }).map(function (st) {
        var here = rows.filter(function (o) { return D.stage(o.stage).order >= st.order || D.isWon(o); });
        return { label: st.key, rows: here, value: measureValue(here), count: here.length };
      });
      baseCount = rows.length;
      baseValue = measureValue(rows);
      return { def: def, groups: groups, cumulative: true, baseCount: baseCount, baseValue: baseValue, rows: rows };
    }

    var by = U.groupBy(rows, def.of);
    groups = Object.keys(by).map(function (k) {
      return { label: k, rows: by[k], value: measureValue(by[k]), count: by[k].length };
    });
    groups = sortGroups(groups, def);
    baseCount = rows.length;
    baseValue = measureValue(rows);
    return { def: def, groups: groups, cumulative: false, baseCount: baseCount, baseValue: baseValue, rows: rows };
  }

  /* ══ 빌더 UI ═════════════════════════════════════════════════════════ */
  function fillSelect(node, options, current, placeholder) {
    node.innerHTML = (placeholder ? '<option value="">' + esc(placeholder) + '</option>' : '') +
      options.map(function (o) {
        return '<option value="' + esc(o.v) + '"' + (current === o.v ? ' selected' : '') + '>' + esc(o.label) + '</option>';
      }).join('');
  }

  function ownerOptions(objKey) {
    var o = OBJ[objKey];
    var rows = o.all();
    if (o.scoped !== false) rows = rows.filter(function (r) { return visible.indexOf(o.ownerOf(r)) > -1; });
    var ids = U.uniq(rows.map(function (r) { return o.ownerOf(r); })).filter(function (id) { return id && db.get('users', id); });
    return U.sortBy(ids.map(function (id) { return { v: id, label: db.userName(id) }; }), 'label');
  }

  function syncBuilder() {
    var o = OBJ[draft.obj];
    fillSelect($('#fObj'), OBJ_KEYS.map(function (k) { return { v: k, label: OBJ[k].label }; }), draft.obj);
    fillSelect($('#fGroup'), o.groups.map(function (g) { return { v: g.k, label: g.label }; }), draft.group);
    fillSelect($('#fMeasure'), o.measures.map(function (m) { return { v: m, label: measureLabel(draft.obj, m) }; }), draft.measure);
    fillSelect($('#fPeriod'), PERIODS, draft.period);
    fillSelect($('#fOwner'), ownerOptions(draft.obj), draft.owner, '담당자 전체');
    fillSelect($('#fStatus'), o.statuses, draft.status, '상태 전체');
    $('#periodKey').textContent = '기간 · ' + o.dateLabel;

    var gd = groupDef(draft.obj, draft.group);
    var weekly = !!(gd && gd.special === 'weekly');
    $('#fPeriod').disabled = weekly;
    $('#fStatus').disabled = weekly;
    $('#builderState').textContent = OBJ[draft.obj].label + ' · ' + (gd ? gd.label : '') + ' · ' + measureLabel(draft.obj, draft.measure);
    markDirty();
  }

  function dirty() {
    return ['obj', 'group', 'measure', 'period', 'owner', 'status'].some(function (k) { return draft[k] !== state[k]; });
  }
  function markDirty() {
    var d = dirty();
    $('#apply').disabled = !d;
    $('#dirtyNote').textContent = d ? '조건이 바뀌었습니다. 적용하면 다시 계산합니다.' : '적용된 조건과 같습니다.';
  }

  function renderPresets() {
    $('#presets').innerHTML = PRESETS.map(function (p) {
      return '<button class="seg__item" type="button" data-preset="' + esc(p.key) + '" aria-pressed="' +
        (state.preset === p.key) + '">' + esc(p.label) + '</button>';
    }).join('');
  }
  function renderViews() {
    $('#views').innerHTML = VIEWS.map(function (v) {
      return '<button class="seg__item" type="button" data-view="' + esc(v.v) + '" aria-pressed="' +
        (state.view === v.v) + '">' + esc(v.label) + '</button>';
    }).join('');
  }

  /* ══ 렌더 ════════════════════════════════════════════════════════════ */
  var result = null, pageGroups = [];

  function render() {
    normalize(state);
    result = compute();
    renderPresets();
    renderViews();
    renderHowto();
    renderTiles();
    renderChart();
    renderTable();
    renderExtra();
    renderSaved();
    renderScopeNote();
    U.revealAll();
  }

  function summaryLine() {
    var o = OBJ[state.obj], gd = result.def;
    var bits = [o.label, gd.label, measureLabel(state.obj, state.measure)];
    if (gd.special !== 'weekly') {
      bits.push(periodLabel(state.period));
      if (state.status) bits.push(o.statuses.filter(function (x) { return x.v === state.status; })[0].label);
    } else {
      bits.push('최근 7일');
    }
    if (state.owner) bits.push(db.userName(state.owner));
    return bits.join(' · ');
  }

  function renderTiles() {

    var tiles = [

        foot: o.label + ' · ' + (result.def.special === 'weekly' ? '최근 7일 관련 건' : periodLabel(state.period)) },
      { label: totalLabel, value: fmtMeasure(result.baseValue),
        foot: result.cumulative ? '누적 통과 집계라 단계별 합계는 서로 겹칩니다' : '그룹 값을 모두 더한 값입니다' },
      { label: '그룹 수', value: U.num(gs.length) + '<small>개</small>',

  function renderChart() {
    var panel = $('#chartPanel');
    if (state.view === 'table') { panel.hidden = true; return; }
    panel.hidden = false;

    var gs = result.groups.filter(function (g) { return g.count > 0 || g.value > 0; });
    if (!gs.length) {
      $('#chartTitle').textContent = '차트';
      $('#chartNote').textContent = '';
      $('#chartHost').innerHTML = ui.empty('그릴 데이터가 없습니다',
        '조건에 맞는 ' + OBJ[state.obj].label + ' 레코드가 없어 차트를 그리지 않았습니다. 아래 표에 무엇을 바꾸면 되는지 적어 두었습니다.');
      return;
    }
    var cap = 12;
    var shown = gs.slice(0, cap);
    $('#chartTitle').textContent = result.def.label + '별 ' + measureLabel(state.obj, state.measure);
    $('#chartNote').textContent = gs.length > cap ? '상위 ' + cap + '개 그룹' : gs.length + '개 그룹';

    var data = shown.map(function (g) { return { label: g.label, value: g.value }; });
    var html = '';
    if (state.view === 'bars') {
      html = ch.bars(data, { h: 220, fmt: fmtAxis, label: result.def.label + '별 ' + measureLabel(state.obj, state.measure) });
    } else if (state.view === 'line') {
      html = ch.line([{ name: measureLabel(state.obj, state.measure), points: data.map(function (d) { return { label: d.label, value: d.value }; }) }],
        { h: 220, area: true, fmt: fmtAxis, label: result.def.label + '별 추이' });
    } else {
      html = ch.funnel(data, { fmt: fmtMeasure, label: result.def.label + ' 퍼널' });
    }
    var note = state.view === 'funnel'
      ? '괄호 안 숫자는 바로 위 항목 대비 남은 비율입니다.'
      : state.view === 'line'
        ? '선은 그룹 순서를 그대로 따릅니다. 월·기간 그룹이 아닐 때는 순위 곡선으로 읽으세요.'
        : '막대는 각 그룹의 ' + measureLabel(state.obj, state.measure) + '입니다.';
    $('#chartHost').innerHTML = html + '<p class="t-micro mt-xs">' + esc(note) +
      (gs.length > cap ? ' 그룹이 ' + gs.length + '개라 상위 ' + cap + '개만 그렸습니다. 나머지는 아래 표에서 볼 수 있습니다.' : '') + '</p>';
  }

  function shareBase() {
    if (result.cumulative) return result.groups.length ? result.groups[0].value : 0;
    if (state.measure === 'avg') {
      return result.groups.reduce(function (a, g) { return Math.max(a, g.value); }, 0);
    }
    return result.groups.reduce(function (a, g) { return a + Math.abs(g.value); }, 0);
  }

  function renderTable() {
    var o = OBJ[state.obj];
    /* 대상 레코드가 하나도 없으면 0으로 채운 그룹 행을 늘어놓지 않습니다. */
    var gs = result.baseCount ? result.groups : [];
    var pages = Math.max(1, Math.ceil(gs.length / PAGE_SIZE));
    if (state.page > pages) state.page = pages;
    if (state.page < 1) state.page = 1;
    var from = (state.page - 1) * PAGE_SIZE;
    pageGroups = gs.slice(from, from + PAGE_SIZE);

    var base = shareBase();
    var shareLabel = result.cumulative ? '통과율' : state.measure === 'avg' ? '최대 대비' : '비중';
    var showMeasure = state.measure !== 'count';

    var cols = [
      { key: 'label', label: result.def.label, sortable: false, cell: function (g) {
          if (g.total) return '<strong>' + esc(g.label) + '</strong>';
          return '<span class="t-nowrap">' + esc(g.label) + '</span>' +
            (g.sign === -1 ? ' <span class="chip chip--idle">빠져나감</span>' : g.sign === 1 ? ' <span class="chip chip--accent">더해짐</span>' : '');
        } },
      { key: 'count', label: '건수', align: 'right', sortable: false, cell: function (g) {
          var t = U.num(g.count) + o.noun;
          return g.total ? '<strong class="t-num">' + t + '</strong>' : '<span class="t-num">' + t + '</span>';
        } }
    ];
    if (showMeasure) {
      cols.push({ key: 'value', label: measureLabel(state.obj, state.measure), align: 'right', sortable: false, cell: function (g) {
        var t = fmtMeasure(g.value);
        return g.total ? '<strong class="t-num">' + esc(t) + '</strong>' : '<span class="t-num">' + esc(t) + '</span>';
      } });
    }
    cols.push({ key: 'share', label: shareLabel, sortable: false, cell: function (g) {
      if (g.total) return '<span class="t-faint">—</span>';
      var p = base > 0 ? (Math.abs(g.value) / base) * 100 : 0;
      var kind = result.cumulative ? (p >= 60 ? 'pos' : p >= 30 ? null : 'warn') : (g.sign === -1 ? 'neg' : null);
      return '<span class="share"><span class="share__n">' + U.pct(p, 1) + '</span>' + ui.meter(p, 100, kind) + '</span>';
    } });

    /* 그룹이 하나도 없으면 합계 행만 남은 표 대신 빈 상태를 보여 줍니다. */
    var rows = pageGroups.slice();
    if (gs.length) {
      rows.push({
        total: true,
        label: result.cumulative ? '대상 전체 (중복 제외)' : '합계',
        count: result.baseCount,
        value: result.baseValue
      });
    }

    /* 필터를 풀면 되는 상황과, 애초에 이 역할이 볼 레코드가 없는 상황은 다르다. */
    var anyInScope = o.scoped === false ? o.all().length
      : o.all().filter(function (r) { return visible.indexOf(o.ownerOf(r)) > -1; }).length;
    var host = $('#tableHost');
    host.innerHTML = '';
    host.appendChild(ui.table(cols, rows, {
      empty: anyInScope ? {
        title: '조건에 맞는 레코드가 없습니다',
        body: '기간을 넓히거나 상태·담당자 필터를 풀면 결과가 다시 계산됩니다.'
      } : {
        title: '집계할 ' + o.label + ' 레코드가 없습니다',
        body: me.role + ' 역할이 담당하는 ' + o.label + ' 레코드가 없어 이 조합으로는 아무것도 나오지 않습니다. 대상 객체를 제작 의뢰로 바꾸면 본부 전체 데이터를 볼 수 있습니다.'
      }
    }));
    if (gs.length) U.qsa('tbody tr', host).forEach(function (tr, i) { if (i === rows.length - 1) tr.classList.add('row-total'); });

    $('#resultTitle').textContent = summaryLine();
    $('#resultCount').textContent = gs.length + '개 그룹 · ' + result.baseCount + o.noun;

    var nums = '';
    var lo = Math.max(1, state.page - 2), hi = Math.min(pages, lo + 4);
    lo = Math.max(1, hi - 4);
    for (var i = lo; i <= hi; i++) {
      nums += '<button class="pager__btn" type="button" data-page="' + i + '"' +
        (i === state.page ? ' aria-current="page"' : '') + '>' + i + '</button>';
    }
    $('#pagerHost').innerHTML =
      '<span class="t-mono">' + (gs.length ? (from + 1) + '–' + Math.min(gs.length, from + PAGE_SIZE) : 0) + ' / ' + gs.length + '개 그룹' +
      (pages > 1 ? ' · CSV는 현재 페이지 기준' : '') + '</span>' +
      '<span class="pager">' +
        '<button class="btn btn--sm btn--ghost" type="button" data-page="' + (state.page - 1) + '"' + (state.page <= 1 ? ' disabled' : '') + '>이전</button>' +
        nums +
        '<button class="btn btn--sm btn--ghost" type="button" data-page="' + (state.page + 1) + '"' + (state.page >= pages ? ' disabled' : '') + '>다음</button>' +
      '</span>';
  }

  /* ══ 프리셋별 상세 블록 ══════════════════════════════════════════════ */
  function scopedOpps() {
    var rows = db.all('opportunities').filter(function (o) { return visible.indexOf(o.ownerId) > -1; });
    if (state.owner) rows = rows.filter(function (o) { return o.ownerId === state.owner; });
    return rows;
  }
  function miniTable(head, body) {
    return '<div class="table-wrap"><table class="table table--compact"><thead><tr>' +
      head.map(function (h) { return '<th scope="col"' + (h.num ? ' class="cell-num"' : '') + '>' + esc(h.label) + '</th>'; }).join('') +
      '</tr></thead><tbody>' + body + '</tbody></table></div>';
  }

  function renderExtra() {
    var panel = $('#extraPanel'), host = $('#extraHost');
    var key = state.preset;
    var fn = EXTRA[key];
    if (!fn) { panel.hidden = true; host.innerHTML = ''; return; }
    var out = fn();
    if (!out || !out.html) { panel.hidden = true; host.innerHTML = ''; return; }
    panel.hidden = false;
    $('#extraTitle').textContent = out.title;
    $('#extraNote').textContent = out.note || '';
    host.innerHTML = out.html;
  }

  var EXTRA = {
    funnel: function () {
      var gs = result.groups;
      if (gs.length < 2 || !gs[0].count) return null;
      var body = '';
      for (var i = 1; i < gs.length; i++) {
        var prev = gs[i - 1], cur = gs[i];
        var rate = prev.count ? (cur.count / prev.count) * 100 : 0;
        var drop = prev.count - cur.count;
        var kind = rate >= 70 ? 'pos' : rate >= 45 ? null : 'neg';
        body += '<tr><td><span class="t-nowrap">' + esc(prev.label) + ' → ' + esc(cur.label) + '</span></td>' +
          '<td class="cell-num t-num">' + U.num(cur.count) + '건</td>' +
          '<td class="cell-num t-num">' + (drop > 0 ? '<span class="t-neg">−' + U.num(drop) + '건</span>' : '<span class="t-faint">0건</span>') + '</td>' +
          '<td><span class="share"><span class="share__n">' + U.pct(rate) + '</span>' + ui.meter(rate, 100, kind) + '</span></td></tr>';
      }
      var worst = null;
      for (var j = 1; j < gs.length; j++) {
        var r = gs[j - 1].count ? (gs[j].count / gs[j - 1].count) * 100 : 100;
        if (!worst || r < worst.rate) worst = { rate: r, from: gs[j - 1].label, to: gs[j].label };
      }
      return {
        title: '단계 간 전환율',
        note: gs[0].count + '건이 리드확보를 통과',
        html: miniTable(
          [{ label: '구간' }, { label: '통과 건수', num: true }, { label: '이탈', num: true }, { label: '전환율' }], body) +
          (worst ? '<p class="t-micro mt-xs">가장 많이 새는 구간은 ' + esc(worst.from) + ' → ' + esc(worst.to) +
            '이고 전환율은 ' + U.pct(worst.rate) + '입니다. 이 구간의 진입 조건을 먼저 점검하세요.</p>' : '')
      };
    },

    winloss: function () {
      var rows = scopedOpps();
      var w = windowOf(state.period);
      if (w) rows = rows.filter(function (o) { return o.closeDate && U.days(w.from, o.closeDate) >= 0 && U.days(o.closeDate, w.to) >= 0; });
      var won = rows.filter(D.isWon), lost = rows.filter(D.isLost);
      if (!won.length && !lost.length) return null;
      var wAmt = U.sum(won, 'amount'), lAmt = U.sum(lost, 'amount');
      var body =
        '<tr><td>성사</td><td class="cell-num t-num">' + U.num(won.length) + '건</td>' +
        '<td class="cell-num t-num">' + U.won(wAmt) + '</td>' +
        '<td class="cell-num t-num">' + (won.length ? U.won(wAmt / won.length) : '—') + '</td></tr>' +
        '<tr><td>실주</td><td class="cell-num t-num">' + U.num(lost.length) + '건</td>' +
        '<td class="cell-num t-num">' + U.won(lAmt) + '</td>' +
        '<td class="cell-num t-num">' + (lost.length ? U.won(lAmt / lost.length) : '—') + '</td></tr>';
      var rateN = won.length + lost.length ? (won.length / (won.length + lost.length)) * 100 : null;
      var rateA = wAmt + lAmt ? (wAmt / (wAmt + lAmt)) * 100 : null;
      var gap = won.length && lost.length ? (lAmt / lost.length) - (wAmt / won.length) : null;
      return {
        title: '승패 대비',
        note: periodLabel(state.period) + ' 마감 기준',
        html: miniTable([{ label: '구분' }, { label: '건수', num: true }, { label: '금액', num: true }, { label: '평균 금액', num: true }], body) +
          '<p class="t-micro mt-xs">건수 기준 성사율 ' + (rateN === null ? '—' : U.pct(rateN)) +
          ' · 금액 기준 성사율 ' + (rateA === null ? '—' : U.pct(rateA)) + '. ' +
          (gap === null ? '비교할 표본이 부족합니다.'
            : gap > 0 ? '실주 딜의 평균 금액이 성사 딜보다 ' + U.won(gap) + ' 큽니다. 큰 딜에서 지고 있다는 뜻입니다.'
              : '성사 딜의 평균 금액이 실주 딜보다 ' + U.won(-gap) + ' 큽니다. 큰 딜은 지키고 있습니다.') + '</p>'
      };
    },

    velocity: function () {
      var open = scopedOpps().filter(D.isOpen);
      if (!open.length) return null;
      var data = D.OPEN_STAGES.map(function (st) {
        var here = open.filter(function (o) { return o.stage === st.key; });
        var avgD = here.length ? U.avg(here.map(D.daysInStage)) : 0;
        var capD = D.STAGE_MAX_DAYS[st.key] || 14;
        return { st: st, here: here, avg: avgD, cap: capD, stalled: here.filter(D.isStalled).length };
      });
      var body = data.map(function (d) {
        var over = d.avg > d.cap;
        return '<tr><td><span class="t-nowrap">' + esc(d.st.key) + '</span></td>' +
          '<td class="cell-num t-num">' + U.num(d.here.length) + '건</td>' +
          '<td class="cell-num t-num"><span class="' + (over ? 't-warn' : '') + '">' +
          (d.here.length ? U.num(d.avg, 1) + '일' : '—') + '</span></td>' +
          '<td class="cell-num t-num">' + d.cap + '일</td>' +
          '<td class="cell-num t-num">' + (d.stalled ? '<span class="t-neg">' + d.stalled + '건</span>' : '<span class="t-faint">0건</span>') + '</td></tr>';
      }).join('');
      var won = scopedOpps().filter(function (o) { return D.isWon(o) && U.days(o.closeDate, C.today) <= 365 && U.days(o.closeDate, C.today) >= 0; });
      var cyc = won.length ? U.avg(won.map(function (o) { return U.days(o.createdAt, o.closeDate); })) : null;
      var stalledAll = open.filter(D.isStalled).length;
      return {
        title: '단계별 체류일과 영업 사이클',
        note: '진행 중 ' + open.length + '건',
        html: ch.bars(data.map(function (d) {
            return { label: d.st.key, value: Math.round(d.avg * 10) / 10, kind: d.avg > d.cap ? 'warn' : null };
          }), { h: 190, fmt: function (v) { return U.num(v, 1); }, label: '단계별 평균 체류일' }) +
          '<p class="t-micro mt-xs">주황 막대는 그 단계의 허용 체류일을 평균이 이미 넘긴 단계입니다.</p>' +
          miniTable([{ label: '단계' }, { label: '진행 건수', num: true }, { label: '평균 체류일', num: true }, { label: '허용', num: true }, { label: '정체', num: true }], body) +
          '<p class="t-micro mt-xs">최근 1년 성사 딜의 평균 영업 사이클은 ' + (cyc === null ? '집계할 성사 딜이 없습니다' : Math.round(cyc) + '일') +
          '이고, 지금 정체로 표시된 딜은 ' + stalledAll + '건입니다.</p>'
      };
    },

    pipeline: function () {
      var open = scopedOpps().filter(D.isOpen);
      if (!open.length) return null;
      var by = U.groupBy(open, 'ownerId');
      var list = U.sortBy(Object.keys(by).map(function (id) {
        var rows = by[id];
        var amt = U.sum(rows, 'amount'), wgt = U.sum(rows, D.weighted);
        return {
          name: db.userName(id), n: rows.length, amt: amt, wgt: wgt,
          avg: rows.length ? amt / rows.length : 0,
          ratio: amt ? (wgt / amt) * 100 : 0,
          commit: U.sum(rows.filter(function (o) { return D.stage(o.stage).cast === 'Commit'; }), 'amount')
        };
      }), 'amt', 'desc');
      var body = list.map(function (r) {
        return '<tr><td><span class="t-nowrap">' + esc(r.name) + '</span></td>' +
          '<td class="cell-num t-num">' + U.num(r.n) + '건</td>' +
          '<td class="cell-num t-num">' + U.won(r.amt) + '</td>' +
          '<td class="cell-num t-num">' + U.won(r.wgt) + '</td>' +
          '<td class="cell-num t-num">' + U.pct(r.ratio) + '</td>' +
          '<td class="cell-num t-num">' + U.won(r.avg) + '</td></tr>';
      }).join('');
      var teamRatio = U.sum(list, 'amt') ? (U.sum(list, 'wgt') / U.sum(list, 'amt')) * 100 : 0;
      return {
        title: '담당자별 가중 대비',
        note: '진행 중 ' + open.length + '건',
        html: miniTable([{ label: '담당자' }, { label: '건수', num: true }, { label: '진행 금액', num: true },
          { label: '가중금액', num: true }, { label: '가중 비율', num: true }, { label: '평균 딜', num: true }], body) +
          '<p class="t-micro mt-xs">가중 비율은 가중금액 ÷ 진행 금액입니다. 팀 평균은 ' + U.pct(teamRatio) +
          '이고, 이보다 낮은 담당자는 초기 단계에 파이프라인이 몰려 있습니다.</p>'
      };
    },

    production: function () {
      var all = db.all('tickets');
      var byType = D.TICKET_TYPES.map(function (tt) {
        var mine = all.filter(function (t) { return t.type === tt.key; });
        var done = mine.filter(function (t) { return t.status === '완료' && t.doneAt; });
        var open = mine.filter(function (t) { return D.TICKET_OPEN.indexOf(t.status) > -1; });
        var lead = done.length ? U.avg(done.map(function (t) { return U.days(t.createdAt, t.doneAt); })) : null;
        var late = done.filter(D.wasLate).length;
        var breach = open.filter(function (t) { return D.slaState(t) === 'breach'; }).length;
        var judged = done.length + open.length;
        var rework = done.length ? (done.filter(function (t) { return (t.reworkCount || 0) > 0; }).length / done.length) * 100 : null;
        return {
          key: tt.key, n: mine.length, done: done.length, open: open.length, lead: lead,
          sla: judged ? ((judged - late - breach) / judged) * 100 : null, rework: rework,
          slaHours: tt.slaHours
        };
      }).filter(function (r) { return r.n > 0; });
      if (!byType.length) return null;
      var body = byType.map(function (r) {
        var slaKind = r.sla === null ? '' : r.sla >= 90 ? 't-pos' : r.sla >= 75 ? 't-warn' : 't-neg';
        return '<tr><td><span class="t-nowrap">' + esc(r.key) + '</span></td>' +
          '<td class="cell-num t-num">' + U.num(r.n) + '건</td>' +
          '<td class="cell-num t-num">' + U.num(r.done) + '건</td>' +
          '<td class="cell-num t-num">' + (r.lead === null ? '—' : U.num(r.lead, 1) + '일') + '</td>' +
          '<td class="cell-num t-num">' + Math.round(r.slaHours / 24) + '일</td>' +
          '<td class="cell-num t-num ' + slaKind + '">' + (r.sla === null ? '—' : U.pct(r.sla)) + '</td>' +
          '<td class="cell-num t-num">' + (r.rework === null ? '—' : U.pct(r.rework)) + '</td></tr>';
      }).join('');
      var worst = U.sortBy(byType.filter(function (r) { return r.lead !== null; }), 'lead', 'desc')[0];
      return {
        title: '제작 유형별 리드타임과 납기',
        note: '전사 제작 의뢰 ' + all.length + '건',
        html: ch.bars(byType.filter(function (r) { return r.lead !== null; }).map(function (r) {
            return { label: r.key, value: Math.round(r.lead * 10) / 10, kind: r.sla !== null && r.sla < 80 ? 'warn' : null };
          }), { h: 190, fmt: function (v) { return U.num(v, 1); }, label: '유형별 평균 리드타임(일)' }) +
          '<p class="t-micro mt-xs">막대는 접수부터 완료까지의 평균 달력 일수입니다. 주황은 납기 준수율이 80% 아래인 유형입니다.</p>' +
          miniTable([{ label: '유형' }, { label: '전체', num: true }, { label: '완료', num: true }, { label: '평균 리드타임', num: true },
            { label: '기준 납기', num: true }, { label: '납기 준수율', num: true }, { label: '재작업률', num: true }], body) +
          (worst ? '<p class="t-micro mt-xs">가장 오래 걸리는 유형은 ' + esc(worst.key) + '이고 평균 ' + U.num(worst.lead, 1) +
            '일입니다. 기준 납기 ' + Math.round(worst.slaHours / 24) + '일과의 차이가 배정 대기인지 검수 왕복인지는 의뢰 상세의 상태 이력에서 확인할 수 있습니다.</p>' : '')
      };
    },

    revenue: function () {
      var rows = scopedOpps().filter(D.isWon);
      var months = [];
      for (var i = 11; i >= 0; i--) {
        var d = new Date(C.today.getFullYear(), C.today.getMonth() - i, 1);
        var p = U.ymOf(d);
        var here = rows.filter(function (o) { return U.ymOf(o.closeDate) === p; });
        months.push({
          label: (d.getMonth() + 1) + '월', period: p, n: here.length,
          amt: U.sum(here, 'amount'), net: U.sum(here, D.netRevenue)
        });
      }
      if (!U.sum(months, 'amt')) return null;
      var body = months.slice().reverse().slice(0, 6).map(function (m) {
        var rate = m.amt ? (m.net / m.amt) * 100 : null;
        return '<tr><td><span class="t-nowrap">' + esc(m.period) + '</span></td>' +
          '<td class="cell-num t-num">' + U.num(m.n) + '건</td>' +
          '<td class="cell-num t-num">' + U.won(m.amt) + '</td>' +
          '<td class="cell-num t-num">' + U.won(m.net) + '</td>' +
          '<td class="cell-num t-num">' + (rate === null ? '—' : U.pct(rate, 1)) + '</td></tr>';
      }).join('');
      var tot = U.sum(months, 'amt'), totNet = U.sum(months, 'net');
      return {
        title: '매출과 순매출',
        note: '최근 12개월 · 마감일 기준',
        html: ch.line([
            { name: '매출', points: months.map(function (m) { return { label: m.label, value: m.amt }; }) },
            { name: '순매출', series: 3, points: months.map(function (m) { return { label: m.label, value: m.net }; }) }
          ], { h: 210, fmt: function (v) { return U.won(v, { unit: false }); }, label: '월별 매출과 순매출' }) +
          ch.legend([{ label: '매출(취급고)', color: 'var(--color-accent)' }, { label: '순매출(수수료 기준)', series: 3 }]) +
          miniTable([{ label: '월' }, { label: '성사 건수', num: true }, { label: '매출', num: true }, { label: '순매출', num: true }, { label: '수수료율', num: true }], body) +
          '<p class="t-micro mt-xs">최근 12개월 합계는 매출 ' + U.won(tot) + ' · 순매출 ' + U.won(totNet) +
          '이고 평균 수수료율은 ' + (tot ? U.pct((totNet / tot) * 100, 1) : '—') + '입니다. 최근 6개월만 표로 펼쳤습니다.</p>'
      };
    },

    weekly: function () {
      var wk = result.weekly || weeklyParts();
      var b = {};
      wk.buckets.forEach(function (x) { b[x.label] = x; });
      var steps = wk.buckets.map(function (x) {
        return { label: x.label, value: x.sign * U.sum(x.rows, 'amount') };
      });
      var moved = steps.some(function (s) { return s.value !== 0; });
      var delta = wk.nowAmt - wk.prevAmt;
      var facts =
        '<div class="rec-facts" style="border-top:none;margin-top:0;padding-top:0">' +
          '<div><p class="rec-fact__k">지난주 파이프라인</p><p class="rec-fact__v t-num">' + U.won(wk.prevAmt) + '</p></div>' +
          '<div><p class="rec-fact__k">이번 주 파이프라인</p><p class="rec-fact__v t-num">' + U.won(wk.nowAmt) + '</p></div>' +
          '<div><p class="rec-fact__k">순증감</p><p class="rec-fact__v">' + ui.delta(delta, function (v) { return U.won(v); }) + '</p></div>' +
          '<div><p class="rec-fact__k">진행 건수</p><p class="rec-fact__v t-num">' + wk.prevCount + '건 → ' + wk.openCount + '건</p></div>' +
        '</div>';
      var chart = moved
        ? ch.waterfall(steps, { h: 230, fmt: function (v) { return U.won(v, { unit: false }); }, label: '최근 7일 파이프라인 변동' })
        : ui.empty('최근 7일에는 움직임이 없습니다', '신규 유입도 성사도 실주도 없었습니다. 파이프라인은 지난주와 같습니다.');
      var body = wk.buckets.map(function (x) {
        return '<tr><td><span class="t-nowrap">' + esc(x.label) + '</span></td>' +
          '<td class="cell-num t-num">' + U.num(x.rows.length) + '건</td>' +
          '<td class="cell-num t-num">' + U.won(U.sum(x.rows, 'amount')) + '</td>' +
          '<td class="cell-num t-num">' + U.won(U.sum(x.rows, D.weighted)) + '</td></tr>';
      }).join('');
      return {
        title: '지난주 대비 파이프라인 변동',
        note: U.fmtDate(wk.from, 'md') + ' ~ ' + U.fmtDate(C.today, 'md'),
        html: facts + '<div class="mt-md">' + chart + '</div>' +
          '<p class="t-micro mt-xs">지난주 파이프라인은 지금 열려 있는 딜에 최근 7일 사이 성사·실주된 딜을 되돌리고, 같은 기간에 새로 만들어진 딜을 빼서 복원한 값입니다. 딜의 금액이 그동안 바뀌지 않았다고 보고 계산합니다. 단계 상승은 총액을 바꾸지 않으므로 누적선은 총액이 아니라 움직인 금액의 누적입니다.</p>' +
          miniTable([{ label: '분류' }, { label: '건수', num: true }, { label: '금액', num: true }, { label: '가중금액', num: true }], body) +
          (b['단계 상승'].rows.length
            ? '<p class="t-micro mt-xs">단계 상승 ' + b['단계 상승'].rows.length + '건은 총액을 바꾸지 않지만 가중금액 ' +
              U.won(U.sum(b['단계 상승'].rows, D.weighted)) + '만큼을 이번 주에 더 확실한 자리로 옮겼습니다.</p>'
            : '<p class="t-micro mt-xs">최근 7일 안에 단계가 오른 딜은 없습니다. 파이프라인의 무게 중심이 그대로라는 뜻입니다.</p>')
      };
    }
  };

  /* ══ 저장된 리포트 — 이 탭의 메모리에만 남습니다 ══════════════════════ */
  var saved = [];

  function renderSaved() {
    var host = $('#savedHost');
    if (!saved.length) {
      host.innerHTML = ui.empty('저장된 리포트가 없습니다',
        '지금 조건을 저장해 두면 프리셋처럼 한 번에 다시 불러올 수 있습니다. 다만 이 탭에서만 유지됩니다.',
        '<button class="btn btn--sm btn--primary" type="button" data-save="1">현재 조건 저장</button>');
      return;
    }
    host.innerHTML = saved.map(function (r) {
      return '<div class="saved__row">' +
        '<span class="grow" style="min-width:0"><span style="display:block">' + esc(r.name) + '</span>' +
        '<span class="t-mono" style="font-size:var(--text-2xs)">' + esc(r.summary) + '</span></span>' +
        '<button class="btn btn--sm" type="button" data-open="' + esc(r.id) + '">열기</button>' +
        '<button class="btn btn--sm btn--ghost" type="button" data-drop="' + esc(r.id) + '">삭제</button>' +
        '</div>';
    }).join('');
  }

  function saveModal() {
    var name = el('input', { class: 'input', 'data-autofocus': '', autocomplete: 'off', value: summaryLine() });
    var field = el('label', { class: 'field' }, [
      el('span', { class: 'field__label', html: '리포트 이름 <span class="req">*</span>' }), name,
      el('span', { class: 'field__error', text: '이름을 입력해야 저장할 수 있습니다.' })
    ]);
    var layer = ui.modal({
      title: '현재 조건 저장',
      body: el('div', { class: 'stack gap-sm' }, [
        field,
        el('p', { class: 't-micro', text: '이 목록은 브라우저에 기록되지 않습니다. 새로고침하거나 탭을 닫으면 사라집니다. 오래 두고 볼 결과는 CSV로 내보내 주세요.' })
      ]),
      actions: [
        { label: '취소' },
        { label: '저장', kind: 'primary', onClick: function () { return doSave(name, field); } }
      ]
    });
    U.on(name, 'keydown', function (e) {
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === 'Enter') { e.preventDefault(); if (doSave(name, field) !== false) layer.close(); }
    });
  }

  function doSave(input, field) {
    var nm = input.value.trim();
    if (!nm) { field.classList.add('is-invalid'); input.focus(); return false; }
    var rec = {
      id: U.uid('rpt'), name: nm, summary: summaryLine(),
      cfg: { obj: state.obj, group: state.group, measure: state.measure, period: state.period, owner: state.owner, status: state.status, view: state.view, preset: state.preset }
    };
    saved.unshift(rec);
    renderSaved();
    ui.toast('“' + nm + '”을(를) 이 탭에 저장했습니다.', {
      undo: function () {
        saved = saved.filter(function (x) { return x.id !== rec.id; });
        renderSaved();
      }
    });
  }

  /* ══ 이벤트 배선 ═════════════════════════════════════════════════════ */
  U.live($('#presets'), 'click', '[data-preset]', function (e, t) {
    var p = preset(t.dataset.preset);
    state = Object.assign(state, p.cfg, { preset: p.key, page: 1 });
    draft = { obj: state.obj, group: state.group, measure: state.measure, period: state.period, owner: state.owner, status: state.status };
    syncBuilder();
    render();
  });

  U.live($('#views'), 'click', '[data-view]', function (e, t) {
    if (state.view === t.dataset.view) return;
    state.view = t.dataset.view;
    renderViews();
    renderChart();
  });

  U.on($('#fObj'), 'change', function () {
    draft.obj = this.value;
    var o = OBJ[draft.obj];
    if (!groupDef(draft.obj, draft.group)) draft.group = o.groups[0].k;
    if (o.measures.indexOf(draft.measure) === -1) draft.measure = 'count';
    if (draft.status && !o.statuses.some(function (x) { return x.v === draft.status; })) draft.status = '';
    if (draft.owner && !ownerOptions(draft.obj).some(function (x) { return x.v === draft.owner; })) draft.owner = '';
    syncBuilder();
  });
  U.on($('#fGroup'), 'change', function () { draft.group = this.value; syncBuilder(); });
  U.on($('#fMeasure'), 'change', function () { draft.measure = this.value; syncBuilder(); });
  U.on($('#fPeriod'), 'change', function () { draft.period = this.value; markDirty(); });
  U.on($('#fOwner'), 'change', function () { draft.owner = this.value; markDirty(); });
  U.on($('#fStatus'), 'change', function () { draft.status = this.value; markDirty(); });

  U.on($('#apply'), 'click', function () {
    ['obj', 'group', 'measure', 'period', 'owner', 'status'].forEach(function (k) { state[k] = draft[k]; });
    state.page = 1;
    state.preset = matchPreset();
    render();
    markDirty();
  });

  U.on($('#resetBuilder'), 'click', function () {
    var p = preset('custom');
    state = Object.assign(state, p.cfg, { preset: 'custom', page: 1 });
    draft = { obj: state.obj, group: state.group, measure: state.measure, period: state.period, owner: state.owner, status: state.status };
    syncBuilder();
    render();
  });

  function matchPreset() {
    for (var i = 0; i < PRESETS.length; i++) {
      var c = PRESETS[i].cfg;
      if (PRESETS[i].key === 'custom') continue;
      if (c.obj === state.obj && c.group === state.group && c.measure === state.measure &&
          c.period === state.period && c.status === state.status && !state.owner) return PRESETS[i].key;
    }
    return 'custom';
  }

  /* 한글 조합 중에는 키보드 처리를 하지 않습니다. */
  U.on($('#builder'), 'keydown', function (e) {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter' && !$('#apply').disabled) { e.preventDefault(); $('#apply').click(); }
  });

  U.live($('#pagerHost'), 'click', '[data-page]', function (e, t) {
    var p = Number(t.dataset.page);
    if (!p || p === state.page) return;
    state.page = p;
    renderTable();
    $('#tableHost').scrollIntoView({ block: 'start' });
  });

  U.on($('#csv'), 'click', function () {
    ui.tableToCSV($('#tableHost .table'), 'closer-report-' + state.obj + '-' + state.group + '.csv');
  });

  U.live($('#savedHost'), 'click', '[data-save]', saveModal);
  U.live($('#savedHost'), 'click', '[data-open]', function (e, t) {
    var rec = saved.filter(function (x) { return x.id === t.dataset.open; })[0];
    if (!rec) return;
    state = Object.assign(state, rec.cfg, { page: 1 });
    draft = { obj: state.obj, group: state.group, measure: state.measure, period: state.period, owner: state.owner, status: state.status };
    syncBuilder();
    render();
  });
  U.live($('#savedHost'), 'click', '[data-drop]', function (e, t) {
    var id = t.dataset.drop;
    var idx = -1;
    saved.forEach(function (x, i) { if (x.id === id) idx = i; });
    if (idx === -1) return;
    var rec = saved[idx];
    saved.splice(idx, 1);
    renderSaved();
    ui.toast('“' + rec.name + '”을(를) 목록에서 뺐습니다.', {
      undo: function () { saved.splice(idx, 0, rec); renderSaved(); }
    });
  });

  /* ── 머리말과 상단 액션 ──────────────────────────────────────────── */
  $('#subline').innerHTML = '대상 객체와 그룹 기준, 측정값을 직접 조립해 집계합니다. ' +
    '지금 집계할 수 있는 레코드는 영업기회 <strong>' + db.all('opportunities').filter(function (o) { return visible.indexOf(o.ownerId) > -1; }).length +
    '건</strong> · 광고주 <strong>' + db.all('accounts').filter(function (a) { return visible.indexOf(a.ownerId) > -1; }).length +
    '개사</strong> · 제작 의뢰 <strong>' + db.all('tickets').length + '건</strong>입니다.';

  $('#headActs').innerHTML =
    '<a class="btn btn--sm" href="insights.html">인사이트</a>' +
    '<a class="btn btn--sm" href="forecast.html">매출 예측</a>' +
    '<button class="btn btn--sm btn--primary" type="button" id="saveTop">현재 조건 저장</button>';
  U.on($('#saveTop'), 'click', saveModal);

  syncBuilder();
  render();
})();
</script>
</body>
</html>
